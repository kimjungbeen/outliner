<!-- 맥 앱(Outliner.app) 아이콘 원본 — 1024 캔버스에 맥 아이콘 격자(824 · 둥근 모서리 185 · 그림자), 그림은 ../static/icon.svg 그대로. Outliner.icns는 이걸 크롬으로 1024 PNG → sips(16~1024) → iconutil 로 만들었어요 -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.28"/></filter>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#ececf0"/></linearGradient>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#sh)"/>
  <rect x="100.75" y="100.75" width="822.5" height="822.5" rx="184.5" fill="none" stroke="#000" stroke-opacity="0.08" stroke-width="1.5"/>
  <g transform="translate(100 100) scale(12.875)" fill="none" stroke="#1d1d1f" stroke-linecap="round" stroke-linejoin="round" stroke-width="5.5">
    <path d="M11 32H39M28 21L39 32L28 43"/>
    <path d="M51 18V46"/>
