<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>아웃라이너</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main>
    <nav id="crumbs" aria-label="경로"></nav>
    <h1 id="title"></h1>
    <div id="tree"></div>
    <div class="tools">
      <button id="add" type="button">+ 항목 추가</button>
      <button id="import" type="button">가져오기</button>
      <input id="importfile" type="file" accept=".json,.md,.markdown,.txt" hidden>
      <details id="export">
        <summary>내보내기</summary>
        <p>범위: <span id="exportscope">전체</span></p>
        <button type="button" data-fmt="md">Markdown (.md)</button>
        <button type="button" data-fmt="txt">텍스트 (.txt)</button>
        <button type="button" data-fmt="json">JSON (.json)</button>
        <button type="button" data-fmt="db">DB 파일 백업 (전체)</button>
      </details>
    </div>
    <div id="selbar" hidden>
      <span id="selcount"></span>
      <button id="sel-copy" type="button">복사</button>
      <button id="sel-del" type="button">삭제</button>
      <button id="sel-clear" type="button">해제</button>
    </div>
  </main>
  <script type="module" src="/app.js"></script>
</body>
</html>
